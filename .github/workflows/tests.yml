# Runs the test suite on Windows, the platform FrameScout targets.
# Only the development requirements (pytest) are installed: the tests cover
# framescout_core, which uses the standard library only, so the job needs neither
# torch nor any model download.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request supersedes its older run (head_ref is only set for
  # pull_request events). Pushes to main and manual runs get a group of their own
  # (run_id), so they are never cancelled or replaced while queued and every commit
  # on main gets its own result.
  group: tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Windows, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The versions Install-FrameScout.bat accepts.
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development requirements (no torch, no models)
        run: python -m pip install -r requirements-dev.txt

      - name: Check that torch is not installed
        # Keeps the "no torch" promise: if requirements-dev.txt ever pulls in torch,
        # this step fails; a test that imports the engine (and thereby torch) fails
        # in the pytest step with an ImportError instead of downloading anything.
        run: python -c "import importlib.util, sys; sys.exit('torch is installed' if importlib.util.find_spec('torch') else 0)"

      - name: Compile all Python files (syntax check)
        # Covers modules the tests never import (app.py, framescout_engine.py) and
        # picks up new files automatically. Compiling does not import torch or
        # streamlit. -x skips paths below dot-directories (.git, .github, .venv, ...).
        run: python -m compileall -x '[\\/]\.' .

      - name: Run tests
        run: python -m pytest
